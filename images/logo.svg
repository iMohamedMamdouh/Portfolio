  <rect width="360" height="360" rx="56" fill="#0b0b0d"/>
  <!-- Inner circle -->
  <circle cx="180" cy="180" r="110" fill="#16161a"/>
  <!-- MM monogram (scaled MarkBadge at 150px, centered at 180,180) -->
